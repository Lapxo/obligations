<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" role="img" aria-labelledby="title desc">
<title id="title">A cell</title>
<desc id="desc">Four origins on one scale: a claims 19.8 to 20.2, b claims 19.9 to 20.3, c claims 19.7 to 20.1 and d claims 24 to 24.4; their claims do not meet.</desc>
<style>
text{font:14px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.claim{fill:#8c959f}.held{fill:#2da44e}.pole{fill:#2da44e;font-weight:600}.axis,.tick{stroke:#8c959f;stroke-width:1}.meet{stroke:#2da44e;stroke-width:1;stroke-dasharray:3 3}
@media (prefers-color-scheme:dark){text{fill:#9198a1}}
</style>
<text x="82" y="32" text-anchor="end">a</text>
<rect class="claim" x="181.4" y="18" width="31" height="18" rx="4"/>
<text x="82" y="66" text-anchor="end">b</text>
<rect class="claim" x="189.1" y="52" width="31.1" height="18" rx="4"/>
<text x="82" y="100" text-anchor="end">c</text>
<rect class="claim" x="173.6" y="86" width="31.1" height="18" rx="4"/>
<text x="82" y="134" text-anchor="end">d</text>
<rect class="claim" x="507.3" y="120" width="31.1" height="18" rx="4"/>
<text x="82" y="168" text-anchor="end">held</text>
<text x="96" y="168">nothing: the claims do not meet</text>
<line class="axis" x1="96" y1="194" x2="616" y2="194"/>
<line class="tick" x1="173.6" y1="194" x2="173.6" y2="199"/>
<text x="173.6" y="216" text-anchor="middle">19.7</text>
<line class="tick" x1="204.7" y1="194" x2="204.7" y2="199"/>
<text x="204.7" y="216" text-anchor="middle">20.1</text>
<line class="tick" x1="507.3" y1="194" x2="507.3" y2="199"/>
<text x="507.3" y="216" text-anchor="middle">24</text>
<line class="tick" x1="538.4" y1="194" x2="538.4" y2="199"/>
<text x="538.4" y="216" text-anchor="middle">24.4</text>
</svg>
