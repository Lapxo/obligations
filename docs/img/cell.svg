<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 178" width="640" height="178" role="img" aria-labelledby="title desc">
<title id="title">A cell</title>
<desc id="desc">Two origins on one scale: a claims 2 to 9 and b claims 5 to 12; what they hold together runs from a floor of 5 to a ceiling of 9.</desc>
<style>
text{font:14px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.claim{fill:#8c959f}.held{fill:#2da44e}.pole{fill:#2da44e;font-weight:600}.axis,.tick{stroke:#8c959f;stroke-width:1}.touch{stroke:#2da44e;stroke-width:1;stroke-dasharray:3 3}
@media (prefers-color-scheme:dark){text{fill:#9198a1}}
</style>
<line class="touch" x1="269.3" y1="12" x2="269.3" y2="126"/>
<line class="touch" x1="442.7" y1="12" x2="442.7" y2="126"/>
<text x="82" y="32" text-anchor="end">a</text>
<rect class="claim" x="139.3" y="18" width="303.4" height="18" rx="4"/>
<text x="82" y="66" text-anchor="end">b</text>
<rect class="claim" x="269.3" y="52" width="303.4" height="18" rx="4"/>
<text x="82" y="100" text-anchor="end">held</text>
<rect class="held" x="269.3" y="86" width="173.4" height="18" rx="4"/>
<line class="axis" x1="96" y1="126" x2="616" y2="126"/>
<line class="tick" x1="139.3" y1="126" x2="139.3" y2="131"/>
<text x="139.3" y="148" text-anchor="middle">2</text>
<line class="tick" x1="269.3" y1="126" x2="269.3" y2="131"/>
<text x="269.3" y="148" text-anchor="middle">5</text>
<line class="tick" x1="442.7" y1="126" x2="442.7" y2="131"/>
<text x="442.7" y="148" text-anchor="middle">9</text>
<line class="tick" x1="572.7" y1="126" x2="572.7" y2="131"/>
<text x="572.7" y="148" text-anchor="middle">12</text>
<text class="pole" x="269.3" y="168" text-anchor="middle">floor</text>
<text class="pole" x="442.7" y="168" text-anchor="middle">ceiling</text>
</svg>
