name: Required Tests for PR

on:
  pull_request:
    branches:
      - main
      - release
    paths-ignore:
      - '**.md'
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check .

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test
