name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install pinned Elan
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --default-toolchain none
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            proofs/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain', 'proofs/lean/lakefile.toml', 'proofs/lean/lake-manifest.json') }}-${{ hashFiles('proofs/lean/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain', 'proofs/lean/lakefile.toml', 'proofs/lean/lake-manifest.json') }}-
      - name: Prepare pinned proof dependencies
        working-directory: proofs/lean
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          printf 'OBLIGATIONS_LEAN=%s/bin/lean\n' "$(lean --print-prefix)" >> "$GITHUB_ENV"
          IFS=: read -ra dependencies <<< "$(lake env printenv LEAN_PATH)"
          proof_path=
          for dependency in "${dependencies[@]}"; do
            test -d "$dependency"
            resolved="$(cd "$dependency" && pwd -P)"
            proof_path="${proof_path:+$proof_path:}$resolved"
          done
          printf 'OBLIGATIONS_LEAN_DEPENDENCIES=%s\n' "$proof_path" >> "$GITHUB_ENV"
      - name: Install the verification instrument
        run: npm install --prefix "$RUNNER_TEMP/obligations-instrument" --no-save --ignore-scripts @lapxo/bound@0.2.6
      - name: Admit signed mathematical declarations
        run: |
          set -euo pipefail
          mkdir -p .bound/cas/blobs
          cp verification/readers/* .bound/cas/blobs/
          node "$RUNNER_TEMP/obligations-instrument/node_modules/@lapxo/bound/dist/cli/verb.js" land TARGET.bound
      - name: Verify mathematical obligations and retain receipts
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/obligations-instrument/node_modules/@lapxo/bound/dist/cli/verb.js" fold
          node "$RUNNER_TEMP/obligations-instrument/node_modules/@lapxo/bound/dist/cli/verb.js" fold --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-receipts-node-${{ matrix.node }}
          path: receipts.bound
          if-no-files-found: error
